
services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
    ports:
      - '5433:5432'
    volumes:
      - 'logbook-data:/var/lib/postgresql'

volumes:
  logbook-data: